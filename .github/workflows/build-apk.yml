name: Build & Deploy APK

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend-etani-main/**'

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: frontend-etani-main/frontend-etani-main
        run: flutter pub get

      - name: Build APK
        working-directory: frontend-etani-main/frontend-etani-main
        run: flutter build apk --release

      - name: Rename APK
        run: cp frontend-etani-main/frontend-etani-main/build/app/outputs/flutter-apk/app-release.apk e-tani.apk

      - name: Upload APK ke server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "e-tani.apk"
          target: "/home/etani-apps/etani/downloads/"
