server {
    listen 80;
    server_name localhost;

    # Jangan cache index.html dan main.dart.js agar selalu fresh
    location ~* (index\.html|main\.dart\.js|flutter_service_worker\.js|flutter_bootstrap\.js)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache aset statis lainnya (Flutter sudah hash nama filenya)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 1. Melayani Frontend Flutter Web
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Meneruskan API ke Backend Container
    location /api/ {
        # Kita hapus '/api' dari URL sebelum dikirim ke backend
        rewrite ^/api/(.*)$ /$1 break;
        
        # 'backend-api' adalah nama service di docker-compose.yml
        proxy_pass http://backend-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
