version: '3.8'

services:
  backend-api:
    build:
      context: ./backend-etani-main/backend-etani-main
      dockerfile: Dockerfile
    container_name: etani-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=10.10.10.50
      - DB_USER=etani_user
      - DB_PASSWORD=etani_pass_123
      - DB_NAME=etani_db
      - DB_PORT=5436
    networks:
      - etani-network

  frontend-web:
    build:
      context: ./frontend-etani-main/frontend-etani-main
      dockerfile: Dockerfile
    container_name: etani-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # APK dan file download disimpan di host agar tetap ada setelah rebuild
      - /home/etani-apps/etani/downloads:/usr/share/nginx/html/downloads
    depends_on:
      - backend-api
    networks:
      - etani-network

networks:
  etani-network:
    driver: bridge
