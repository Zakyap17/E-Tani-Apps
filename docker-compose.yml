version: '3.8'

services:
  backend-api:
    build:
      context: ./backend-etani-main/backend-etani-main
      dockerfile: Dockerfile
    container_name: etani-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=192.168.x.x
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=mydb
      - DB_PORT=5432
    networks:
      - etani-network

  frontend-web:
    build:
      context: ./frontend-etani-main/frontend-etani-main
      dockerfile: Dockerfile
    container_name: etani-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend-api
    networks:
      - etani-network

networks:
  etani-network:
    driver: bridge
