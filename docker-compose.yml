version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: etani-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=etani_user
      - POSTGRES_PASSWORD=etani_pass_123
      - POSTGRES_DB=etani_db
    volumes:
      - etani_pgdata:/var/lib/postgresql/data
    networks:
      - etani-network

  backend-api:
    build:
      context: ./backend-etani-main/backend-etani-main
      dockerfile: Dockerfile
    container_name: etani-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=etani_user
      - DB_PASSWORD=etani_pass_123
      - DB_NAME=etani_db
      - DB_PORT=5432
    depends_on:
      - db
    networks:
      - etani-network

  frontend-web:
    build:
      context: ./frontend-etani-main/frontend-etani-main
      dockerfile: Dockerfile
    container_name: etani-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # APK dan file download disimpan di host agar tetap ada setelah rebuild
      - /home/etani-apps/etani/downloads:/usr/share/nginx/html/downloads
    depends_on:
      - backend-api
    networks:
      - etani-network

volumes:
  etani_pgdata:

networks:
  etani-network:
    driver: bridge
